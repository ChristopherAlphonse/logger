name: Auto Release on Main Mergename: Auto Release on Main Merge



on:on:

  push:  push:

    branches: [main]    branches: [main]



jobs:jobs:

  auto-release:  auto-release:

    runs-on: ubuntu-latest    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'    if: github.event_name == 'push' && github.ref == 'refs/heads/main'



    steps:    steps:

      - name: Checkout code      - name: Checkout code

        uses: actions/checkout@v4        uses: actions/checkout@v4

        with:        with:

          fetch-depth: 0          fetch-depth: 0

          token: ${{ secrets.GITHUB_TOKEN }}          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Setup Node.js      - name: Setup Node.js

        uses: actions/setup-node@v4        uses: actions/setup-node@v4

        with:        with:

          node-version: 20.x          node-version: 20.x

          registry-url: 'https://registry.npmjs.org'          registry-url: 'https://registry.npmjs.org'



      - name: Setup pnpm      - name: Setup pnpm

        uses: pnpm/action-setup@v4        uses: pnpm/action-setup@v4

        with:        with:

          version: 8.15.0          version: 8.15.0



      - name: Get pnpm store directory      - name: Get pnpm store directory

        shell: bash        shell: bash

        run: |        run: |

          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV



      - name: Setup pnpm cache      - name: Setup pnpm cache

        uses: actions/cache@v4        uses: actions/cache@v4

        with:        with:

          path: ${{ env.STORE_PATH }}          path: ${{ env.STORE_PATH }}

          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

          restore-keys: |          restore-keys: |

            ${{ runner.os }}-pnpm-store-            ${{ runner.os }}-pnpm-store-



      - name: Install dependencies      - name: Install dependencies

        run: pnpm install --frozen-lockfile        run: pnpm install --frozen-lockfile



      - name: Run CI checks      - name: Run CI checks

        run: |        run: |

          pnpm biome:fix-and-check          pnpm biome:fix-and-check

          pnpm type-check          pnpm type-check

          pnpm test          pnpm test

          pnpm build          pnpm build



      - name: Get current version      - name: Get current version

        id: current-version        id: current-version

        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT



      - name: Determine version bump type      - name: Determine version bump type

        id: bump-type        id: bump-type

        run: |        run: |

          # Get the latest commit message to determine bump type          # Get the latest commit message to determine bump type

          COMMIT_MSG=$(git log -1 --pretty=%B)          COMMIT_MSG=$(git log -1 --pretty=%B)



          if echo "$COMMIT_MSG" | grep -qE "\[major\]|BREAKING CHANGE"; then          if echo "$COMMIT_MSG" | grep -qE "\[major\]|BREAKING CHANGE"; then

            echo "type=major" >> $GITHUB_OUTPUT            echo "type=major" >> $GITHUB_OUTPUT

          elif echo "$COMMIT_MSG" | grep -qE "\[minor\]|feat:|feature:"; then          elif echo "$COMMIT_MSG" | grep -qE "\[minor\]|feat:|feature:"; then

            echo "type=minor" >> $GITHUB_OUTPUT            echo "type=minor" >> $GITHUB_OUTPUT

          else          else

            echo "type=patch" >> $GITHUB_OUTPUT            echo "type=patch" >> $GITHUB_OUTPUT

          fi          fi



      - name: Bump version      - name: Bump version

        id: version        id: version

        run: |        run: |

          TYPE=${{ steps.bump-type.outputs.type }}          TYPE=${{ steps.bump-type.outputs.type }}

          NEW_VERSION=$(npm version $TYPE --no-git-tag-version)          NEW_VERSION=$(npm version $TYPE --no-git-tag-version)

          echo "version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT          echo "version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT

          echo "New version: ${NEW_VERSION#v}"          echo "New version: ${NEW_VERSION#v}"



      - name: Generate changelog entry      - name: Generate changelog entry

        id: changelog        id: changelog

        run: |        run: |

          VERSION=${{ steps.version.outputs.version }}          VERSION=${{ steps.version.outputs.version }}

          DATE=$(date +%Y-%m-%d)          DATE=$(date +%Y-%m-%d)



          # Get commit messages since last tag          # Get commit messages since last tag

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then          if [ -n "$LAST_TAG" ]; then

            COMMITS=$(git log $LAST_TAG..HEAD --oneline --pretty=format:"- %s")            COMMITS=$(git log $LAST_TAG..HEAD --oneline --pretty=format:"- %s")

          else          else

            COMMITS=$(git log --oneline --pretty=format:"- %s" | head -10)            COMMITS=$(git log --oneline --pretty=format:"- %s" | head -10)

          fi          fi



          # Create minimal changelog entry          # Create minimal changelog entry

          CHANGELOG_ENTRY="## [$VERSION] - $DATE          CHANGELOG_ENTRY="## [$VERSION] - $DATE



          ### Changes          ### Changes

          $COMMITS          $COMMITS

          "          "



          # Save to file for later use          # Save to file for later use

          echo "$CHANGELOG_ENTRY" > /tmp/changelog_entry.md          echo "$CHANGELOG_ENTRY" > /tmp/changelog_entry.md



          # Update CHANGELOG.md          # Update CHANGELOG.md

          if [ -f CHANGELOG.md ]; then          if [ -f CHANGELOG.md ]; then

            echo -e "$CHANGELOG_ENTRY\n$(cat CHANGELOG.md)" > CHANGELOG.md            echo -e "$CHANGELOG_ENTRY\n$(cat CHANGELOG.md)" > CHANGELOG.md

          else          else

            echo "$CHANGELOG_ENTRY" > CHANGELOG.md            echo "$CHANGELOG_ENTRY" > CHANGELOG.md

          fi          fi



      - name: Configure Git      - name: Configure Git

        run: |        run: |

          git config --local user.email "action@github.com"          git config --local user.email "action@github.com"

          git config --local user.name "GitHub Action"          git config --local user.name "GitHub Action"



      - name: Commit version bump and changelog      - name: Commit version bump and changelog

        run: |        run: |

          git add package.json CHANGELOG.md          git add package.json CHANGELOG.md

          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"

          git push origin main          git push origin main



      - name: Create Git tag      - name: Create Git tag

        run: |        run: |

          git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"          git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"

          git push origin v${{ steps.version.outputs.version }}          git push origin v${{ steps.version.outputs.version }}



      - name: Check if version exists on npm      - name: Check if version exists on npm

        id: npm-check        id: npm-check

        run: |        run: |

          VERSION=${{ steps.version.outputs.version }}          VERSION=${{ steps.version.outputs.version }}

          if npm view @calphonse/logger@$VERSION version >/dev/null 2>&1; then          if npm view @calphonse/logger@$VERSION version >/dev/null 2>&1; then

            echo "exists=true" >> $GITHUB_OUTPUT            echo "exists=true" >> $GITHUB_OUTPUT

          else          else

            echo "exists=false" >> $GITHUB_OUTPUT            echo "exists=false" >> $GITHUB_OUTPUT

          fi          fi



      - name: Publish to npm      - name: Publish to npm

        if: steps.npm-check.outputs.exists == 'false'        if: steps.npm-check.outputs.exists == 'false'

        run: pnpm publish --no-git-checks --access public        run: pnpm publish --no-git-checks --access public

        env:        env:

          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}



      - name: Create GitHub Release      - name: Create GitHub Release

        uses: actions/create-release@v1        uses: actions/create-release@v1

        env:        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:        with:

          tag_name: v${{ steps.version.outputs.version }}          tag_name: v${{ steps.version.outputs.version }}

          release_name: Release v${{ steps.version.outputs.version }}          release_name: Release v${{ steps.version.outputs.version }}

          body_path: /tmp/changelog_entry.md          body_path: /tmp/changelog_entry.md

          draft: false          draft: false

          prerelease: false          prerelease: false



      - name: Create success summary      - name: Create success summary

        run: |        run: |

          echo "##  Release Summary" >> $GITHUB_STEP_SUMMARY          echo "##  Release Summary" >> $GITHUB_STEP_SUMMARY

          echo "- **Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY          echo "- **Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

          echo "- **Type:** ${{ steps.bump-type.outputs.type }}" >> $GITHUB_STEP_SUMMARY          echo "- **Type:** ${{ steps.bump-type.outputs.type }}" >> $GITHUB_STEP_SUMMARY

          echo "- **NPM Published:** ${{ steps.npm-check.outputs.exists == 'false' && ' Yes' || ' Already exists' }}" >> $GITHUB_STEP_SUMMARY          echo "- **NPM Published:** ${{ steps.npm-check.outputs.exists == 'false' && ' Yes' || ' Already exists' }}" >> $GITHUB_STEP_SUMMARY

          echo "- **GitHub Release:**  Created" >> $GITHUB_STEP_SUMMARY          echo "- **GitHub Release:**  Created" >> $GITHUB_STEP_SUMMARY

          echo "- **Changelog:**  Updated" >> $GITHUB_STEP_SUMMARY          echo "- **Changelog:**  Updated" >> $GITHUB_STEP_SUMMARY
