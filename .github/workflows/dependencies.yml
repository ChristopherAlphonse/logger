name: Dependencies

on:
  schedule:

    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8.15.0

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check for outdated dependencies
      id: outdated
      run: |
        OUTDATED=$(pnpm outdated --format json | jq -r '.[] | select(.current != .latest) | .name + "@" + .latest' | head -10)
        if [ -n "$OUTDATED" ]; then
          echo "outdated=true" >> $GITHUB_OUTPUT
          echo "outdated_packages<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTDATED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "outdated=false" >> $GITHUB_OUTPUT
        fi

    - name: Run security audit
      id: audit
      run: |
        AUDIT_RESULT=$(pnpm audit --audit-level moderate --json 2>/dev/null || echo '{"vulnerabilities": {}}')
        VULNERABILITIES=$(echo "$AUDIT_RESULT" | jq '.vulnerabilities | length')
        echo "vulnerabilities=$VULNERABILITIES" >> $GITHUB_OUTPUT

    - name: Create issue for outdated dependencies
      if: steps.outdated.outputs.outdated == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const packages = `${{ steps.outdated.outputs.outdated_packages }}`.split('\n').filter(pkg => pkg.trim());

          const body = `## Dependency Updates Available

          The following dependencies have newer versions available:

          ${packages.map(pkg => `- \`${pkg}\``).join('\n')}

          ### To update:
          1. Run \`pnpm update\` to update all dependencies
          2. Run \`pnpm audit --fix\` to fix security vulnerabilities
          3. Test the changes thoroughly
          4. Create a PR with the updates

          ---
          *This issue was automatically created by the dependency check workflow.*`;

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Dependency Updates Available',
            body: body,
            labels: ['dependencies', 'automated']
          });

    - name: Create issue for security vulnerabilities
      if: steps.audit.outputs.vulnerabilities != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const body = `## Security Vulnerabilities Detected

          **${{ steps.audit.outputs.vulnerabilities }}** security vulnerabilities were found in the dependencies.

          ### To fix:
          1. Run \`pnpm audit\` to see detailed information
          2. Run \`pnpm audit --fix\` to automatically fix vulnerabilities
          3. For vulnerabilities that can't be auto-fixed, manually update the affected packages
          4. Test thoroughly after updates
          5. Create a PR with the security fixes

          ---
          *This issue was automatically created by the security audit workflow.*`;

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Security Vulnerabilities Detected',
            body: body,
            labels: ['security', 'automated']
          });
