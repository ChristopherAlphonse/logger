name: Release branch CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-for-release-branch:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Comment on PR with artifact notice
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          body: |
            A build for this release branch was produced and uploaded as an artifact named `dist`.
            You can download it from the Actions run artifacts. If you need a direct link, please open the workflow run and download the "dist" artifact.
