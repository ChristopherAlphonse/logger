name: Version Bump

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'version-bump')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.18.3

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Determine version bump type
      id: bump-type
      run: |
        # Check PR labels for version bump type
        if contains('${{ github.event.pull_request.labels.*.name }}', 'major'); then
          echo "type=major" >> $GITHUB_OUTPUT
        elif contains('${{ github.event.pull_request.labels.*.name }}', 'minor'); then
          echo "type=minor" >> $GITHUB_OUTPUT
        elif contains('${{ github.event.pull_request.labels.*.name }}', 'patch'); then
          echo "type=patch" >> $GITHUB_OUTPUT
        else
          echo "type=patch" >> $GITHUB_OUTPUT
        fi

    - name: Bump version
      id: version
      run: |
        TYPE=${{ steps.bump-type.outputs.type }}
        NEW_VERSION=$(npm version $TYPE --no-git-tag-version)
        echo "version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
        echo "New version: ${NEW_VERSION#v}"

    - name: Update CHANGELOG.md
      run: |
        VERSION=${{ steps.version.outputs.version }}
        DATE=$(date +%Y-%m-%d)

        # Create changelog entry
        CHANGELOG_ENTRY="## [$VERSION] - $DATE

        ### Added
        - Features added in this release

        ### Changed
        - Changes made in this release

        ### Fixed
        - Bug fixes in this release

        ### Breaking Changes
        - Breaking changes (if any)

        ---

        "

        # Prepend to CHANGELOG.md
        echo -e "$CHANGELOG_ENTRY$(cat CHANGELOG.md)" > CHANGELOG.md

    - name: Commit and push changes
      run: |
        git add package.json CHANGELOG.md
        git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
        git push origin main

    - name: Create PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const body = `**Version bumped to ${{ steps.version.outputs.version }}**

          The version has been automatically bumped from the previous version.

          ### Next steps:
          1. Review the changes in the main branch
          2. Add the \`publish\` label to this PR if you want to publish to npm
          3. Or create a new PR with the \`publish\` label to publish this version

          ---
          *This was automatically handled by the version bump workflow.*`;

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
